id: dea:scale-services-delivery-v1
version: 2.0.0
metamodel_version: 1.0.0
name: Services Delivery Maturity Model Scale (5-level)
description: 'Model-owned scale for the Services Delivery Maturity Model. Five capability levels (L-1..L-5) scored
  against the canonical v2 band instance (dea:maturity-bands-v2 v1.0.0): non-linear band widths 20/25/25/18/12
  with per-level effort multipliers 1.0 → 6.0. Linear topology, exponential progression. Level semantics
  are carried verbatim from the authoritative source; only the scoring fields differ between the frozen
  v1-alpha lineage and the canonical v2 scheme. Adoption of the L-0 Not Assessed + L-1..L-5
  numbering follows dea-metamodel #214 and remains annotated as adoption-pending until the canonical
  owners ratify.'
status: stable
ordering: ascending
progression:
  topology: linear
  function: exponential
levels:
- id: L-0
  ordinal: 0
  name: Not Assessed
  definition: 'Criterion not assessed: no evidence examined. Not a capability level: it scores 0 points
    and lowers evidence-confidence, and it never inflates the index.'
  characteristics:
  - No evidence collected or verified.
  expected_practices: []
  evidence_expectations: []
  short_description: Unassessed
- id: L-1
  ordinal: 1
  name: Emergent
  definition: Practice exists but is person-dependent and informal
  characteristics:
  - Release dates slip frequently
  - Quality measured by bug count, not customer impact
  - Customer satisfaction not systematically tracked
  - Scope, time, quality trade-offs made ad-hoc
  expected_practices:
  - Release predictability tracked
  - Customer satisfaction baseline measured
  - Delivery retrospectives held
  evidence_expectations:
  - Quarterly commitments missed > 50% of time
  - Quality measured only as defect count
  - Customer satisfaction surveys absent
  short_description: Delivery is unpredictable
- id: L-2
  ordinal: 2
  name: Structured
  definition: Documented, agreed, but inconsistently enforced
  characteristics:
  - Sprint/iteration cadence in place
  - Definition of Done documented
  - Customer impact metrics tracked
  - Delivery retrospectives feed into planning
  expected_practices:
  - 80% of releases hit planned dates
  - Customer satisfaction ≥ neutral baseline
  - Retrospective actions tracked to completion
  evidence_expectations:
  - Burndown/burnup charts in use
  - Customer NPS or CSAT trend tracked
  - Action register from retrospectives
  short_description: Core delivery practices established
- id: L-3
  ordinal: 3
  name: Systematic
  definition: Formal, tooling-enabled, governance active
  characteristics:
  - Flow metrics tracked (lead time, cycle time, WIP)
  - Customer outcomes linked to releases
  - Quality measured by escaped defects
  - Predictive release date forecasting
  expected_practices:
  - Lead time for changes < 1 week
  - Change failure rate < 15%
  - Customer outcome improvements > 5% YoY
  evidence_expectations:
  - Flow metrics dashboard published
  - Release forecasting accuracy > 80%
  - Outcome-tracking per feature
  short_description: Delivery is data-informed
- id: L-4
  ordinal: 4
  name: Adaptive
  definition: Metrics-driven; organisation senses and responds
  characteristics:
  - Delivery ROI measured per initiative
  - Customer LTV/CAC improvement linked to delivery
  - Time-to-market is competitive advantage
  - A/B testing infrastructure mature
  expected_practices:
  - Delivery ROI > 5x measured
  - Time-to-market improving quarterly
  - A/B testing informs > 50% of major decisions
  evidence_expectations:
  - Delivery ROI dashboards
  - Time-to-market competitive benchmarks
  - Experimentation velocity tracked
  short_description: Delivery is optimised
- id: L-5
  ordinal: 5
  name: Self-Optimising
  definition: Continuous improvement is autonomous, not programme-driven
  characteristics:
  - Industry-leading time-to-market
  - Continuous delivery with zero-downtime deployments
  - Customer outcome focus drives everything
  - External recognition as delivery leader
  expected_practices:
  - None — continuous improvement is the practice
  evidence_expectations:
  - Industry awards or analyst recognition
  - Conference talks on delivery practice
  - Open-source delivery tooling contributions
  short_description: Delivery is market-leading
